{{define "styles"}}
<style>
    :root {
        --ink: #171b23; --muted: #69707d; --faint: #969ca7;
        --paper: #eceff3; --surface: #ffffff; --hairline: #e1e5ea;
        --s-draft:#7a8497; --s-applied:#2563c9; --s-interviewing:#b26a00;
        --s-offer:#0f8a52; --s-accepted:#0a6b3d; --s-rejected:#b23b3b; --s-withdrawn:#8a8f98;
        --sans: -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, monospace;
    }
    [data-status="draft"]{--sc:var(--s-draft)} [data-status="applied"]{--sc:var(--s-applied)}
    [data-status="interviewing"]{--sc:var(--s-interviewing)} [data-status="offer"]{--sc:var(--s-offer)}
    [data-status="accepted"]{--sc:var(--s-accepted)} [data-status="rejected"]{--sc:var(--s-rejected)}
    [data-status="withdrawn"]{--sc:var(--s-withdrawn)}
    [data-kind="tailor"]{--kc:#2563c9} [data-kind="prep"]{--kc:#7a3fc9}
    [data-jobstatus="running"]{--jc:#b26a00} [data-jobstatus="done"]{--jc:#0f8a52} [data-jobstatus="failed"]{--jc:#b23b3b}

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.45; }
    .shell { max-width:960px; margin:0 auto; padding:40px 24px 80px; }
    a { color: var(--s-applied); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .masthead { display:flex; align-items:baseline; justify-content:space-between; gap:14px; margin-bottom:26px; flex-wrap:wrap; }
    .brand { display:flex; align-items:center; gap:8px; }
    .brand-mark { color:var(--ink); font-size:13px; transform:translateY(-1px); }
    .brand-name { font-weight:650; letter-spacing:-0.01em; font-size:20px; color:var(--ink); }
    .brand-name:hover { text-decoration:none; }
    nav.tabs { display:flex; gap:4px; font-family:var(--mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; }
    nav.tabs a { padding:6px 12px; border-radius:7px; color:var(--muted); }
    nav.tabs a.active { background:var(--ink); color:#fff; }
    nav.tabs a.active:hover { text-decoration:none; }

    .add { display:flex; gap:10px; margin-bottom:26px; flex-wrap:wrap; }
    .add input { flex:1 1 180px; min-width:0; padding:10px 12px; border:1px solid var(--hairline); border-radius:8px; background:var(--surface); color:var(--ink); font:inherit; }
    input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid var(--s-applied); outline-offset:1px; border-color:transparent; }
    .btn { padding:10px 18px; border:0; border-radius:8px; background:var(--ink); color:#fff; font:inherit; font-weight:550; cursor:pointer; }
    .btn:hover { background:#000; }
    .btn.secondary { background:#3a2f6b; }

    .board-wrap { overflow-x:auto; border:1px solid var(--hairline); border-radius:12px; background:var(--surface); }
    table.board { width:100%; border-collapse:collapse; min-width:720px; }
    .board th { text-align:left; padding:12px 14px; font-family:var(--mono); font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.12em; color:var(--faint); border-bottom:1px solid var(--hairline); }
    .board td { padding:14px; border-bottom:1px solid var(--hairline); vertical-align:middle; }
    .board tbody tr:last-child td { border-bottom:0; }
    .board tbody tr:hover { background:#f7f9fb; }
    tr[data-status] td:first-child { box-shadow:inset 3px 0 var(--sc); }
    .mono{font-family:var(--mono)} .muted{color:var(--muted)}
    td.id { font-family:var(--mono); color:var(--faint); font-size:13px; }
    .who { display:flex; flex-direction:column; gap:1px; }
    .who .company{font-weight:600} .who .role{color:var(--muted); font-size:13px;}
    .jd-open { margin-top:6px; display:inline-block; cursor:pointer; font-family:var(--mono); font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--s-applied); background:transparent; border:1px solid color-mix(in srgb, var(--s-applied) 30%, white); border-radius:6px; padding:3px 9px; }
    .jd-open:hover { background:color-mix(in srgb, var(--s-applied) 8%, white); }
    .jd-modal { width:min(680px, 92vw); max-height:82vh; border:1px solid var(--hairline); border-radius:14px; padding:0; background:var(--surface); color:var(--ink); box-shadow:0 24px 60px rgba(0,0,0,0.22); overflow:hidden; }
    .jd-modal::backdrop { background:rgba(20,24,32,0.42); }
    .jd-modal-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:18px 20px 12px; border-bottom:1px solid var(--hairline); position:sticky; top:0; background:var(--surface); }
    .jd-modal-company { font-weight:650; font-size:16px; }
    .jd-modal-role { color:var(--muted); font-size:13px; margin-top:2px; }
    .jd-close { border:0; background:transparent; font-size:24px; line-height:1; color:var(--faint); cursor:pointer; padding:0 4px; }
    .jd-close:hover { color:var(--ink); }
    .jd-modal .jd-text { white-space:pre-wrap; font-family:var(--mono); font-size:12.5px; line-height:1.6; color:var(--ink); margin:0; padding:18px 20px; max-height:66vh; overflow-y:auto; background:#fbfcfd; }
    .status-form { display:flex; align-items:center; gap:8px; }
    .pill { font-family:var(--mono); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; padding:4px 9px; border-radius:999px; color:var(--sc); background:color-mix(in srgb, var(--sc) 12%, white); border:1px solid color-mix(in srgb, var(--sc) 32%, white); white-space:nowrap; }
    select { font:inherit; font-size:13px; color:var(--muted); padding:5px 8px; border:1px solid var(--hairline); border-radius:7px; background:var(--surface); cursor:pointer; }
    .note-form { display:flex; gap:6px; align-items:center; }
    .note-form input { flex:1; min-width:120px; padding:7px 10px; border:1px solid var(--hairline); border-radius:7px; background:var(--surface); color:var(--ink); font:inherit; font-size:13px; }
    .ghost { padding:7px 11px; border:1px solid var(--hairline); border-radius:7px; background:transparent; color:var(--muted); font:inherit; font-size:12px; cursor:pointer; }
    .ghost:hover { color:var(--ink); border-color:var(--muted); }
    .delete-form { margin-top:6px; }
    .ghost.danger { color:var(--s-rejected); }
    .ghost.danger:hover { color:#fff; background:var(--s-rejected); border-color:var(--s-rejected); }
    .empty { padding:48px 24px; text-align:center; color:var(--muted); border:1px dashed var(--hairline); border-radius:12px; background:var(--surface); }

    .rail { list-style:none; margin:0 0 30px; padding:14px 18px; display:flex; flex-wrap:wrap; gap:22px; background:var(--surface); border:1px solid var(--hairline); border-radius:10px; }
    .rail-stage { display:flex; align-items:center; gap:8px; position:relative; font-family:var(--mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }
    .rail-stage .dot { width:9px; height:9px; border-radius:50%; background:var(--sc); box-shadow:0 0 0 3px color-mix(in srgb, var(--sc) 16%, white); }
    .rail-stage:not(:last-child)::after { content:""; width:22px; height:1px; margin-left:4px; background:var(--hairline); }

    /* generate + job pages */
    .panel { background:var(--surface); border:1px solid var(--hairline); border-radius:12px; padding:22px; }
    .lead { color:var(--muted); margin:0 0 18px; }
    textarea { width:100%; min-height:220px; resize:vertical; padding:12px 14px; border:1px solid var(--hairline); border-radius:10px; font-family:var(--mono); font-size:13px; line-height:1.5; color:var(--ink); background:#fbfcfd; }
    .actions { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
    .jobs-recent { margin-top:30px; }
    .jobs-recent h2 { font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--faint); margin:0 0 10px; }
    .job-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--hairline); }
    .job-row:last-child { border-bottom:0; }
    .kindtag { font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.08em; padding:3px 8px; border-radius:6px; color:var(--kc); background:color-mix(in srgb, var(--kc) 12%, white); }
    .jobstatus { font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--jc); }
    .job-label { color:var(--muted); font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    .status-head { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
    .spinner { width:14px; height:14px; border-radius:50%; border:2px solid color-mix(in srgb, var(--jc) 30%, white); border-top-color:var(--jc); }
    @media (prefers-reduced-motion: no-preference) { .spinner { animation: spin 0.8s linear infinite; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result { white-space:pre-wrap; font-family:var(--mono); font-size:13px; line-height:1.55; background:#fbfcfd; border:1px solid var(--hairline); border-radius:10px; padding:18px; overflow-x:auto; }
    .errbox { color:var(--s-rejected); background:color-mix(in srgb, var(--s-rejected) 8%, white); border:1px solid color-mix(in srgb, var(--s-rejected) 25%, white); border-radius:10px; padding:14px 16px; font-size:14px; }
    /* profile form */
    .profile-form { display:flex; flex-direction:column; gap:14px; }
    .profile-form label { display:flex; flex-direction:column; gap:5px; font-size:12px; font-family:var(--mono); letter-spacing:0.04em; text-transform:uppercase; color:var(--faint); }
    .profile-form input { padding:10px 12px; border:1px solid var(--hairline); border-radius:8px; background:#fbfcfd; color:var(--ink); font:inherit; font-size:14px; }
    .profile-form .row { display:flex; gap:14px; }
    .profile-form .row label { flex:1; }
    .saved-note { display:inline-block; margin-bottom:14px; padding:6px 12px; border-radius:8px; font-size:13px; color:var(--s-offer); background:color-mix(in srgb, var(--s-offer) 12%, white); border:1px solid color-mix(in srgb, var(--s-offer) 30%, white); }
    @media (max-width:560px){ .profile-form .row { flex-direction:column; } }

    @media (prefers-reduced-motion:no-preference){ .board tbody tr{transition:background 120ms ease;} }
    @media (max-width:560px){ .shell{padding:28px 16px 60px;} }
</style>
{{end}}

{{define "nav"}}
<header class="masthead">
    <div class="brand"><span class="brand-mark">&#9670;</span><a class="brand-name" href="/">ai-resume-tailor</a></div>
    <nav class="tabs">
        <a href="/profile"{{if eq .Active "profile"}} class="active"{{end}}>Profile</a>
        <a href="/"{{if eq .Active "pipeline"}} class="active"{{end}}>Pipeline</a>
        <a href="/generate"{{if eq .Active "generate"}} class="active"{{end}}>Generate</a>
    </nav>
</header>
{{end}}
